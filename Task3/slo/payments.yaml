apiVersion: openslo/v1
kind: SLO
metadata:
  name: payment-service-availability
  displayName: Доступность платежного модуля маркетплейса
spec:
  service: payment-service
  description: Сквозной транзакционный SLO процесса оплаты, ограниченный SLA внешних шлюзов (Paystack/M-Pesa).
  budgetingMethod: Occurrences
  objectives:
    - ratioMetrics:
        good:
          metricSource:
            metricSourceRef: prometheus
          spec:
            query: sum(rate(payment_gateway_adapter_sessions_total{status="success"}[5m]))
        total:
          metricSource:
            metricSourceRef: prometheus
          spec:
            query: sum(rate(payment_gateway_adapter_sessions_total}[5m]))
      target: 0.9900
      timeWindow:
        - duration: 30d
          isRolling: true
  alertPolicies:
    - alertPolicyRef: payment-failover-trigger
